name: INWP Sovereign CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: '1.22'
  SERVICE_DIR: attendance-service

jobs:
  governance-check:
    name: Governance Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Verify service boundary
        run: |
          test -f "$SERVICE_DIR/go.mod"
          test ! -e Cargo.toml
          test ! -e terraform
      - name: Validate Go packages
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...
      - name: Validate dependency graph
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod verify

  build-and-test:
    name: Build and Test
    needs: governance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Go vet
        working-directory: ${{ env.SERVICE_DIR }}
        run: go vet ./...
      - name: Go test
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test -race ./...
      - name: Build attendance service
        working-directory: ${{ env.SERVICE_DIR }}
        run: go build ./...

  supply-chain:
    name: Supply Chain Verification
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Verify modules
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod verify
      - name: Generate dependency manifest
        working-directory: ${{ env.SERVICE_DIR }}
        run: go list -m all > /tmp/inwp-go-modules.txt
      - name: Upload dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: inwp-go-modules
          path: /tmp/inwp-go-modules.txt

  runtime-certification:
    name: Runtime Certification
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Runtime package verification
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...

  reproducible-build:
    name: Reproducible Build
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Build twice with deterministic flags
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          go build -trimpath -buildvcs=false -o /tmp/inwp-sync-engine-a ./cmd/attendance-service
          go build -trimpath -buildvcs=false -o /tmp/inwp-sync-engine-b ./cmd/attendance-service
          sha256sum /tmp/inwp-sync-engine-a /tmp/inwp-sync-engine-b
          cmp /tmp/inwp-sync-engine-a /tmp/inwp-sync-engine-b

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml

  chaos-validation:
    name: Chaos Readiness
    needs: [build-and-test, runtime-certification, reproducible-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Offline and recovery test suite
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...
