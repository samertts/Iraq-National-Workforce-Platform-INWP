name: INWP Sovereign CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: '1.22'
  RUST_VERSION: stable
  SERVICE_DIR: attendance-service
  SYNC_DIR: backend/sync-engine

jobs:
  governance-check:
    name: Governance Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Verify service boundary
        run: |
          test -f "$SERVICE_DIR/go.mod"
          test ! -e Cargo.toml
          test ! -e terraform
      - name: Validate Go packages
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...
      - name: Validate dependency graph
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod verify

  build-and-test:
    name: Build and Test
    needs: governance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Go vet
        working-directory: ${{ env.SERVICE_DIR }}
        run: go vet ./...
      - name: Go test
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test -race ./...
      - name: Build attendance service
        working-directory: ${{ env.SERVICE_DIR }}
        run: go build ./...

  workforce-api-check:
    name: Workforce API Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/workforce-api/package-lock.json
      - name: Install dependencies
        working-directory: backend/workforce-api
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        working-directory: backend/workforce-api
        run: npm run check
      - name: Run API unit tests
        working-directory: backend/workforce-api
        run: npm test
      - name: Audit production dependencies
        working-directory: backend/workforce-api
        run: npm audit --omit=dev --audit-level=high
      - name: Build non-root container image
        run: docker build --tag inwp-workforce-api:ci backend/workforce-api

  sync-engine-check:
    name: Sync Engine Build and Test
    needs: governance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Do not restore compiled target artifacts across hosted runners.
          # A cached build script can be incompatible with the current runner CPU.
          key: ${{ runner.os }}-cargo-deps-v2-${{ hashFiles('backend/sync-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deps-v2-
      - name: Rust format check
        working-directory: ${{ env.SYNC_DIR }}
        run: cargo fmt --check
      - name: Rust check
        working-directory: ${{ env.SYNC_DIR }}
        run: cargo check --locked
      - name: Rust tests
        working-directory: ${{ env.SYNC_DIR }}
        run: cargo test --locked
      - name: Rust clippy
        working-directory: ${{ env.SYNC_DIR }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  compose-validation:
    name: Compose Configuration
    needs: [build-and-test, sync-engine-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full local stack
        run: docker compose -f deploy/docker-compose.full.yml config

  supply-chain:
    name: Supply Chain Verification
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Verify modules
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod verify
      - name: Generate dependency manifest
        working-directory: ${{ env.SERVICE_DIR }}
        run: go list -m all > /tmp/inwp-go-modules.txt
      - name: Upload dependency manifest
        uses: actions/upload-artifact@v7
        with:
          name: inwp-go-modules
          path: /tmp/inwp-go-modules.txt

  runtime-certification:
    name: Runtime Certification
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Runtime package verification
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...

  reproducible-build:
    name: Reproducible Build
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Build twice with deterministic flags
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          go build -trimpath -buildvcs=false -o /tmp/inwp-sync-engine-a ./cmd/attendance-service
          go build -trimpath -buildvcs=false -o /tmp/inwp-sync-engine-b ./cmd/attendance-service
          sha256sum /tmp/inwp-sync-engine-a /tmp/inwp-sync-engine-b
          cmp /tmp/inwp-sync-engine-a /tmp/inwp-sync-engine-b

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chaos-validation:
    name: Chaos Readiness
    needs: [build-and-test, sync-engine-check, runtime-certification, reproducible-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: attendance-service/go.sum
      - name: Offline and recovery test suite
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...
